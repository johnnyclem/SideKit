name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

  core-tests:
    name: SideKitCore offline logic tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: SideKitCore
        run: swift test --parallel

  build:
    name: Build app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild
        run: |
          xcodebuild build \
            -project SideKit.xcodeproj \
            -scheme SideKit \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
